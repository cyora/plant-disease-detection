spring.application.name=backend
server.port=8080

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/plant_disease?serverTimezone=UTC
spring.datasource.username=plantapp
# Local development password. In production it would come from the DB_PASSWORD environment variable.
spring.datasource.password=${DB_PASSWORD:plantapp_local}

# --- JPA / Hibernate ---
# "update" creates and updates the tables from the entities (fine for a student project; Flyway would be the production choice)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Seed data (data.sql) ---
# Run data.sql at every startup, after Hibernate has created the tables
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# --- Error messages in API responses ---
server.error.include-message=always
